name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-thesis:
    name: test-thesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests with coverage (100% required on critical-path files)
        run: npm run test:coverage
